<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeh Porcino | Designer Gráfica & Web Designer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Syne:wght@700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================================================
           VARIÁVEIS DE DESIGN E CONFIGURAÇÕES GLOBAIS (ESTILO BLACK)
           ========================================================================== */
        :root {
            --font-titles: 'Syne', sans-serif;
            --font-body: 'Inter', sans-serif;
            --color-bg: #0b0b0b;
            --color-card: #141414;
            --color-text-primary: #f5f5f7;
            --color-text-secondary: #9e9e9e;
            --color-accent: #ffffff;
            --border-style: 1px solid #1f1f1f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            font-family: var(--font-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            font-family: var(--font-titles);
            color: var(--color-accent);
            line-height: 1.2;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* ==========================================================================
           HEADER & NAVEGAÇÃO (EFEITO BLUR PREMIUM)
           ========================================================================== */
        header {
            background-color: rgba(11, 11, 11, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: var(--border-style);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header-container {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .brand-name {
            font-family: var(--font-titles);
            font-weight: 800;
            letter-spacing: 1px;
            font-size: 1.2rem;
        }

        nav ul {
            display: flex;
            gap: 1.2rem;
            list-style: none;
        }

        nav a {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--color-accent);
        }

        main {
            padding-top: 5rem;
        }

        section {
            padding: 5rem 1.5rem;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==========================================================================
           PÁGINA 1: HERO SECTION (BANNER DO TOPO)
           ========================================================================== */
        .hero-section {
            width: 100%;
            min-height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            padding: 0;
        }

        .hero-banner-img {
            width: 100%;
            height: auto;
            max-width: 100%;
            display: block;
        }

        /* ==========================================================================
           PÁGINA 2: SOBRE MIM
           ========================================================================== */
        .about-container {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .about-text p {
            color: var(--color-text-secondary);
            margin-bottom: 1.5rem;
            font-weight: 300;
            font-size: 1.05rem;
            text-align: justify;
        }

        .about-image-wrapper {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .responsive-img {
            border-radius: 12px;
            border: var(--border-style);
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* ==========================================================================
           PÁGINAS VISUAIS & WEB (SERVIÇOS)
           ========================================================================== */
        .services-section h2 {
            text-align: center;
        }

        .services-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .service-card {
            background-color: var(--color-card);
            padding: 2.5rem 2rem;
            border-radius: 8px;
            border: var(--border-style);
            transition: transform 0.3s, border-color 0.3s;
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: #333;
        }

        .service-icon {
            font-size: 2.2rem;
            margin-bottom: 1.25rem;
            color: var(--color-text-primary);
        }

        .service-card h3 {
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
        }

        .service-card p {
            color: var(--color-text-secondary);
            font-size: 0.95rem;
            font-weight: 300;
        }

        /* ==========================================================================
           CASES DE SUCESSO (GRADE REVISADA CONTRA DEFORMAÇÃO)
           ========================================================================== */
        .portfolio-section h2 {
            text-align: center;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-top: 3rem;
        }

        .portfolio-item {
            background-color: var(--color-card);
            border-radius: 8px;
            overflow: hidden;
            border: var(--border-style);
            display: flex;
            flex-direction: column;
        }

        .portfolio-img-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portfolio-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .portfolio-item:hover .portfolio-img {
            transform: scale(1.04);
        }

        .portfolio-info {
            padding: 1.5rem;
            background-color: var(--color-card);
            margin-top: auto;
        }

        .portfolio-info h3 {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }

        .case-category {
            color: var(--color-text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==========================================================================
           CONTATO & FORMULÁRIO (INTEGRADO AO SHEETMONKEY)
           ========================================================================== */
        .contact-container {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .contact-info p {
            color: var(--color-text-secondary);
            margin-top: 0.5rem;
            font-weight: 300;
        }

        .contact-links-list {
            list-style: none;
            margin-top: 2rem;
        }

        .contact-links-list li {
            margin-bottom: 1.25rem;
        }

        .contact-links-list a {
            color: var(--color-text-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.05rem;
            transition: color 0.3s;
        }

        .contact-links-list a:hover {
            color: var(--color-text-secondary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text-primary);
        }

        input, textarea {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--color-card);
            border: var(--border-style);
            color: var(--color-text-primary);
            border-radius: 6px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            transition: border-color 0.3s, background-color 0.3
