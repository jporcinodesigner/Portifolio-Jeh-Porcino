<!-- Seção de Contato / Briefing Integrado ao SheetMonkey -->
<section id="contato" class="contact-section">
    <div class="contact-container">
        <div class="contact-info">
            <h2 class="section-title">Vamos tirar sua ideia do papel?</h2>
            <p>Preencha o briefing abaixo para agilizarmos o seu atendimento no WhatsApp.</p>
        </div>

        <form id="whatsappForm" class="contact-form">
            <div class="form-group">
                <label for="name">Seu nome</label>
                <input type="text" id="name" name="Nome" placeholder="Como podemos te chamar?" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="Email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Telefone / WhatsApp</label>
                <input type="tel" id="phone" name="Telefone" placeholder="(67) 99999-9999" required>
            </div>

            <div class="form-group">
                <label for="tipo_projeto">Tipo de Projeto</label>
                <input type="text" id="tipo_projeto" name="Tipo de Projeto" placeholder="Ex: Landing Page, Logotipo..." required>
            </div>

            <div class="form-group">
                <label for="nicho">Qual é o nicho do seu negócio?</label>
                <input type="text" id="nicho" name="Nicho" placeholder="Ex: Hamburgueria, Odontologia..." required>
            </div>

            <div class="form-group">
                <label for="identidade">Você já possui identidade visual?</label>
                <input type="text" id="identidade" name="Possui Identidade Visual" placeholder="Sim / Não / Preciso criar" required>
            </div>

            <div class="form-group">
                <label for="funcionalidades">Funcionalidades ou Detalhes Especiais</label>
                <textarea id="funcionalidades" name="Funcionalidades" rows="3" placeholder="Ex: Botão de WhatsApp, catálogo..."></textarea>
            </div>

            <div class="form-group">
                <label for="referencias">Referências ou Links de Inspiração (Opcional)</label>
                <input type="text" id="referencias" name="Referências" placeholder="Cole links de sites ou estilos que você gosta">
            </div>

            <button type="submit" id="submitBtn" class="service-card" style="width: 100%; text-align: center; cursor: pointer; font-weight: bold; background: #ffffff; color: #000000; border: none; padding: 1rem; border-radius: 6px;">Enviar Briefing para o WhatsApp</button>
        </form>
    </div>
</section>

<script>
    // Script de integração do SheetMonkey e redirecionamento para o WhatsApp
    document.getElementById('whatsappForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Enviando informações...";
        btn.disabled = true;
        
        const formData = new FormData(this);

        try {
            await fetch('https://api.sheetmonkey.io/form/2HdteMvA7JR8yEhrfBhR4H', {
                method: 'POST',
                body: formData
            });
        } catch (error) {
            console.error("Erro ao salvar na planilha:", error);
        }

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const tipo = document.getElementById('tipo_projeto').value;
        const nicho = document.getElementById('nicho').value;
        const identidade = document.getElementById('identidade').value;
        const funcs = document.getElementById('funcionalidades').value;
        const refs = document.getElementById('referencias').value;

        let message = `Olá! Meu nome é *${name}* (${phone}).\n\n`;
        message += `Gostaria de solicitar um orçamento com base no briefing:\n`;
        message += `• *Projeto:* ${tipo}\n`;
        message += `• *Nicho:* ${nicho}\n`;
        message += `• *Identidade Visual:* ${identidade}\n`;
        if (funcs) message += `• *Detalhes:* ${funcs}\n`;
        if (refs) message += `• *Referências:* ${refs}`;
        
        window.location.href = `https://wa.me/5567991713343?text=${encodeURIComponent(message)}`;
    });
</script>
