<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeh Porcino | Designer Gráfica & Web Designer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Syne:wght@700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================================================
            VARIÁVEIS DE DESIGN E CONFIGURAÇÕES GLOBAIS (ESTILO BLACK)
            ========================================================================== */
        :root {
            --font-titles: 'Syne', sans-serif;
            --font-body: 'Inter', sans-serif;
            --color-bg: #0b0b0b;
            --color-card: #141414;
            --color-text-primary: #f5f5f7;
            --color-text-secondary: #9e9e9e;
            --color-accent: #ffffff;
            --border-style: 1px solid #1f1f1f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            font-family: var(--font-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            font-family: var(--font-titles);
            color: var(--color-accent);
            line-height: 1.2;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* ==========================================================================
            HEADER & NAVEGAÇÃO (EFEITO BLUR PREMIUM)
            ========================================================================== */
        header {
            background-color: rgba(11, 11, 11, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: var(--border-style);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header-container {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .brand-name {
            font-family: var(--font-titles);
            font-weight: 800;
            letter-spacing: 1px;
            font-size: 1.2rem;
        }

        nav ul {
            display: flex;
            gap: 1.2rem;
            list-style: none;
        }

        nav a {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--color-accent);
        }

        main {
            padding-top: 5rem;
        }

        section {
            padding: 5rem 1.5rem;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==========================================================================
            PÁGINA 1: HERO SECTION (BANNER DO TOPO)
            ========================================================================== */
        .hero-section {
            width: 100%;
            min-height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            padding: 0;
        }

        .hero-banner-img {
            width: 100%;
            height: auto;
            max-width: 100%;
            display: block;
        }

        /* ==========================================================================
            PÁGINA 2: SOBRE MIM
            ========================================================================== */
        .about-container {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .about-text p {
            color: var(--color-text-secondary);
            margin-bottom: 1.5rem;
            font-weight: 300;
            font-size: 1.05rem;
            text-align: justify;
        }

        .about-image-wrapper {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .responsive-img {
            border-radius: 12px;
            border: var(--border-style);
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* ==========================================================================
            PÁGINAS VISUAIS & WEB (SERVIÇOS)
            ========================================================================== */
        .services-section h2 {
            text-align: center;
        }

        .services-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .service-card {
            background-color: var(--color-card);
            padding: 2.5rem 2rem;
            border-radius: 8px;
            border: var(--border-style);
            transition: transform 0.3s, border-color 0.3s;
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: #333;
        }

        .service-icon {
            font-size: 2.2rem;
            margin-bottom: 1.25rem;
            color: var(--color-text-primary);
        }

        .service-card h3 {
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
        }

        .service-card p {
            color: var(--color-text-secondary);
            font-size: 0.95rem;
            font-weight: 300;
        }

        /* ==========================================================================
            CASES DE SUCESSO
            ========================================================================== */
        .portfolio-section h2 {
            text-align: center;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-top: 3rem;
        }

        .portfolio-item {
            background-color: var(--color-card);
            border-radius: 8px;
            overflow: hidden;
            border: var(--border-style);
            display: flex;
            flex-direction: column;
        }

        .portfolio-img-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portfolio-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .portfolio-item:hover .portfolio-img {
            transform: scale(1.04);
        }

        .portfolio-info {
            padding: 1.5rem;
            background-color: var(--color-card);
            margin-top: auto;
        }

        .portfolio-info h3 {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }

        .case-category {
            color: var(--color-text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==========================================================================
            CONTATO & FORMULÁRIO (INTEGRADO AO SHEETMONKEY COM TODAS AS COLUNAS)
            ========================================================================== */
        .contact-container {
            display: flex;
            flex-direction: column;
            gap: 3rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .contact-info p {
            color: var(--color-text-secondary);
            margin-top: 0.5rem;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text-primary);
        }

        input, textarea, select {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--color-card);
            border: var(--border-style);
            color: var(--color-text-primary);
            border-radius: 6px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo-wrapper">
                <span class="brand-name">JEH PORCINO</span>
            </div>
            <nav>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#solucoes">Soluções</a></li>
                    <li><a href="#cases">Cases</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!-- Seção de Contato / Briefing -->
        <section id="contato" class="contact-section">
            <div class="contact-container">
                <div class="contact-info">
                    <h2 class="section-title">Contato</h2>
                    <p>Preencha o formulário para iniciarmos um projeto.</p>
                </div>

                <form id="whatsappForm" class="contact-form" action="https://api.sheetmonkey.io/form/2HdteMvA7JR8yEhrfBhR4H" method="POST">
                    
                    <div class="form-group">
                        <label for="name">Seu Nome</label>
                        <input type="text" id="name" name="Nome" placeholder="Como podemos te chamar?" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Seu E-mail</label>
                        <input type="email" id="email" name="Email" placeholder="seu@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Telefone</label>
                        <input type="tel" id="phone" name="Telefone" placeholder="(67) 99999-9999" required>
                    </div>

                    <!-- Campo oculto para atender a coluna x-redirect do SheetMonkey se necessário -->
                    <input type="hidden" name="x-redirect" value="">

                    <div class="form-group">
                        <label for="tipo_projeto">Tipo de Projeto</label>
                        <input type="text" id="tipo_projeto" name="Tipo de Projeto" placeholder="Ex: Landing Page, Identidade Visual..." required>
                    </div>

                    <div class="form-group">
                        <label for="nicho">Nicho</label>
                        <input type="text" id="nicho" name="Nicho" placeholder="Ex: Hamburgueria, Odontologia..." required>
                    </div>

                    <div class="form-group">
                        <label for="identidade">Possui Identidade Visual?</label>
                        <select id="identidade" name="Possui Identidade Visual" required>
                            <option value="" disabled selected>Selecione uma opção</option>
                            <option value="Sim">Sim</option>
                            <option value="Não">Não</option>
                            <option value="Preciso criar">Preciso criar / modernizar</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="funcionalidades">Funcionalidades</label>
                        <textarea id="funcionalidades" name="Funcionalidades" rows="3" placeholder="Como posso te ajudar? Descreva os detalhes..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="referencias">Referências</label>
                        <input type="text" id="referencias" name="Referências" placeholder="Links ou estilos de inspiração">
                    </div>

                    <button type="submit" id="submitBtn" style="width: 100%; text-align: center; cursor: pointer; font-weight: bold; background: #ffffff; color: #000000; border: none; padding: 1rem; border-radius: 6px; text-transform: uppercase; letter-spacing: 1px;">Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        // Integração completa salvando na planilha do SheetMonkey e redirecionando para o WhatsApp
        document.getElementById('whatsappForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Enviando...";
            btn.disabled = true;
            
            const formData = new FormData(this);

            try {
                await fetch('https://api.sheetmonkey.io/form/2HdteMvA7JR8yEhrfBhR4H', {
                    method: 'POST',
                    body: formData
                });
            } catch (error) {
                console.error("Erro ao salvar na planilha:", error);
            }

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const tipo = document.getElementById('tipo_projeto').value;
            const nicho = document.getElementById('nicho').value;
            const identidade = document.getElementById('identidade').value;
            const funcs = document.getElementById('funcionalidades').value;
            const refs = document.getElementById('referencias').value;

            let message = `Olá! Meu nome é *${name}* (${phone}).\n\n`;
            message += `Gostaria de solicitar um orçamento com base no briefing:\n`;
            message += `• *Projeto:* ${tipo}\n`;
            message += `• *Nicho:* ${nicho}\n`;
            message += `• *Identidade Visual:* ${identidade}\n`;
            if (funcs) message += `• *Detalhes:* ${funcs}\n`;
            if (refs) message += `• *Referências:* ${refs}`;
            
            window.location.href = `https://wa.me/5567991713343?text=${encodeURIComponent(message)}`;
        });
    </script>
</body>
</html>
